<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港釣魚潮汐｜HKO潮汐＋風浪水溫月相</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{background:#111;color:#eee;padding:16px;max-width:620px;margin:0 auto}
.card{background:#222;border-radius:14px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:22px}
h3{margin:0 0 10px;font-size:18px}
.tide-row{padding:10px;border-radius:8px;margin:6px 0}
.tide-in{background:#006622;color:#9f9} /* 漲潮：綠色 */
.tide-out{background:#661111;color:#f99} /* 退潮：紅色 */
.tide-unknown{background:#333;color:#ccc}
.moon{font-size:48px;text-align:center;margin:8px 0}
.fish-note{padding:12px;border-radius:10px;background:#23395d;border:1px solid #668}
.pressure-box{padding:12px;border-radius:10px;background:#353;border:1px solid #6a6;margin-bottom:10px}
.pressure-trend{font-size:13px;color:#cfe3cf;margin-top:6px}
select{width:100%;padding:10px;font-size:16px;border-radius:8px;margin-bottom:10px}
.loading{color:#aaa;text-align:center;padding:10px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat-grid > .loading{grid-column:1/-1}
.stat{background:#2b2b2b;border-radius:8px;padding:10px}
.stat-label{font-size:12px;color:#aaa;margin-bottom:4px}
.stat-value{font-size:15px;font-weight:600;line-height:1.35}
.stat-value.warn{color:#ffb454}
.stat-value.danger{color:#ff6b6b}
.astro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.astro-grid > .loading{grid-column:1/-1}
.astro-item{background:#2b2b2b;border-radius:8px;padding:10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.astro-item b{font-weight:600}
.risk-line{padding:8px 0;border-bottom:1px solid #333;font-size:14px}
.risk-line:last-child{border-bottom:none}
.risk-danger{color:#ff8a8a}
.risk-ok{color:#9f9}
.source-note{color:#777;font-size:11px;text-align:center;padding:4px 0 8px}
</style>
</head>
<body>
<h2>🎣 香港釣魚潮汐表（天文台數據）</h2>
<select id="spot">
<option value="CCH">長洲 CCH</option>
<option value="TBT">尖鼻咀 TBT</option>
<option value="TMW" selected>大廟灣 TMW</option>
<option value="QUB">鰂魚涌 QUB</option>
</select>

<div class="card">
  <div id="moonBox"></div>
  <div id="sunMoon" class="astro-grid loading">載入日月時間...</div>
  <div id="fishTip" style="margin-top:10px"></div>
</div>

<div class="card">
  <h3>🌡️ 即時環境</h3>
  <div id="pressureBox" class="loading">載入氣壓資料...</div>
  <div id="envGrid" class="stat-grid"><div class="loading">載入天氣及海況...</div></div>
</div>

<div class="card">
  <h3>⛈️ 天氣風險</h3>
  <div id="riskBox" class="loading">載入警告及閃電資料...</div>
</div>

<div class="card">
  <h3 id="tideTitle">🌊 今日潮汐</h3>
  <div id="tideList" class="loading">載入天文台潮汐...</div>
</div>

<div class="source-note">資料：香港天文台（潮汐／日月／閃電／警告）‧ Open-Meteo（天氣／氣壓／海況）</div>

<script>
const HKO_OPEN_API = "https://data.weather.gov.hk/weatherAPI/opendata/opendata.php";
const HKO_WEATHER_API = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";
const OPEN_METEO_API = "https://api.open-meteo.com/v1/forecast";
const MARINE_API = "https://marine-api.open-meteo.com/v1/marine";

const SPOTS = {
  CCH: { name: "長洲", lat: 22.208, lon: 114.027 },
  TBT: { name: "尖鼻咀", lat: 22.486, lon: 113.995 },
  TMW: { name: "大廟灣", lat: 22.26, lon: 114.29 },
  QUB: { name: "鰂魚涌", lat: 22.282, lon: 114.213 }
};

// ========== 共用工具 ==========
async function fetchJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function getHKDateParts(date = new Date()){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Hong_Kong",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);
  const get = type => parts.find(p => p.type === type).value;
  return { year: get("year"), month: get("month"), day: get("day") };
}

function windDirection(deg){
  const dirs = ["北", "東北", "東", "東南", "南", "西南", "西", "西北"];
  return dirs[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
}

function beaufort(kmh){
  const limits = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];
  let scale = 0;
  for(const limit of limits){
    if(kmh >= limit) scale++;
    else break;
  }
  return scale;
}

function waveText(height){
  if(height < 0.5) return "平靜";
  if(height < 1.25) return "小浪";
  if(height < 2.5) return "中浪";
  if(height < 4) return "大浪";
  return "巨浪";
}

function weatherText(code){
  const map = {
    0: "☀️ 天晴", 1: "🌤️ 大致天晴", 2: "⛅ 部分多雲", 3: "☁️ 陰",
    45: "🌫️ 有霧", 48: "🌫️ 霧凇",
    51: "🌦️ 毛毛雨", 53: "🌦️ 毛毛雨", 55: "🌧️ 毛毛雨",
    56: "🌧️ 凍毛毛雨", 57: "🌧️ 凍毛毛雨",
    61: "🌧️ 小雨", 63: "🌧️ 中雨", 65: "🌧️ 大雨",
    66: "🌧️ 凍雨", 67: "🌧️ 凍雨",
    71: "🌨️ 小雪", 73: "🌨️ 中雪", 75: "🌨️ 大雪", 77: "🌨️ 雪粒",
    80: "🌦️ 驟雨", 81: "🌧️ 中驟雨", 82: "⛈️ 大驟雨",
    85: "🌨️ 陣雪", 86: "🌨️ 大陣雪",
    95: "⛈️ 雷暴", 96: "⛈️ 雷暴夾冰雹", 99: "⛈️ 強雷暴夾冰雹"
  };
  return map[code] || "未知天氣";
}

// ========== 月相計算 ==========
function getMoonPhase(date){
  const knownNewMoon = new Date("1970-01-07T20:35:00Z");
  const lunarCycle = 2551443000; // 29.53059日
  const diff = date.getTime() - knownNewMoon.getTime();
  const phase = ((diff % lunarCycle) + lunarCycle) % lunarCycle / lunarCycle;
  let emoji, name;
  if(phase<0.05 || phase>0.95){emoji="🌚";name="新月（幾乎無月光）"}
  else if(phase<0.25){emoji="🌒";name="娥眉月"}
  else if(phase<0.30){emoji="🌓";name="上弦月"}
  else if(phase<0.48){emoji="🌔";name="盈凸月"}
  else if(phase<0.52){emoji="🌕";name="滿月（月光強）"}
  else if(phase<0.70){emoji="🌖";name="虧凸月"}
  else if(phase<0.75){emoji="🌗";name="下弦月"}
  else {emoji="🌘";name="殘月"}
  return {emoji,name};
}

// ========== 氣壓提示（專為淺水石灘魚） ==========
function getPressureTip(hpa){
  const value = hpa.toFixed(1);
  if(hpa >= 1008 && hpa <=1013){
    return `✅ 氣壓 ${value} hPa｜黃金範圍！淺水溶氧充足，火點、泥猛好活躍，適合淺灘作釣`;
  }else if(hpa>1013 && hpa <=1020){
    return `⚠️ 氣壓 ${value} hPa｜氣壓偏高，魚多匿石底，咬口減慢，建議貼底慢釣`;
  }else if(hpa <1008){
    return `❌ 氣壓 ${value} hPa｜偏低，淺水缺氧，魚唔願上淺灘，淺灘魚口差`;
  }else{
    return `ℹ️ 氣壓 ${value} hPa｜正常，觀察潮水同風向`;
  }
}

// ========== 讀 Open-Meteo：氣壓、風、氣溫、海況 ==========
async function loadEnvironment(spotCode){
  const spot = SPOTS[spotCode];
  const pressureBox = document.getElementById("pressureBox");
  const grid = document.getElementById("envGrid");
  pressureBox.className = "loading";
  pressureBox.textContent = "載入氣壓資料...";
  grid.className = "stat-grid";
  grid.innerHTML = `<div class="loading">載入天氣及海況...</div>`;

  const weatherUrl = `${OPEN_METEO_API}?latitude=${spot.lat}&longitude=${spot.lon}`
    + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
    + "&hourly=pressure_msl&past_hours=3&forecast_hours=0&timezone=Asia%2FHong_Kong";
  const marineUrl = `${MARINE_API}?latitude=${spot.lat}&longitude=${spot.lon}`
    + "&current=wave_height,wave_direction,wave_period,sea_surface_temperature,ocean_current_velocity"
    + "&timezone=Asia%2FHong_Kong";

  const [weatherResult, marineResult] = await Promise.allSettled([
    fetchJson(weatherUrl),
    fetchJson(marineUrl)
  ]);
  const weather = weatherResult.status === "fulfilled" ? weatherResult.value : null;
  const marine = marineResult.status === "fulfilled" ? marineResult.value : null;

  if(!weather && !marine){
    pressureBox.className = "loading";
    pressureBox.textContent = "⚠️ 天氣及海況載入失敗，請稍後再試";
    grid.innerHTML = `<div class="loading">⚠️ 天氣及海況載入失敗</div>`;
    console.error("天氣載入失敗:", weatherResult.reason);
    console.error("海況載入失敗:", marineResult.reason);
    return;
  }

  renderEnvironment(weather, marine);
}

function renderEnvironment(weather, marine){
  const pressureBox = document.getElementById("pressureBox");
  const grid = document.getElementById("envGrid");
  const tiles = [];

  if(weather && weather.current){
    const c = weather.current;
    const pressure = Number(c.pressure_msl);
    const hourlyPressure = weather.hourly && weather.hourly.pressure_msl;

    if(Number.isFinite(pressure)){
      let trendHtml = "";
      if(Array.isArray(hourlyPressure) && Number.isFinite(Number(hourlyPressure[0]))){
        const delta = pressure - Number(hourlyPressure[0]);
        const arrow = Math.abs(delta) < 0.3 ? "→ 平穩" : delta > 0 ? "↗️ 回升" : "↘️ 下降";
        const sign = delta > 0 ? "+" : "";
        trendHtml = `<div class="pressure-trend">${arrow}｜過去3小時 ${sign}${delta.toFixed(1)} hPa</div>`;
      }
      pressureBox.className = "";
      pressureBox.innerHTML = `<div class="pressure-box">${getPressureTip(pressure)}${trendHtml}</div>`;
    }

    const windSpeed = Number(c.wind_speed_10m);
    const gustSpeed = Number(c.wind_gusts_10m);
    const windScale = beaufort(windSpeed);
    const gustScale = beaufort(gustSpeed);

    if(Number.isFinite(windSpeed)){
      tiles.push({
        label: "風",
        value: `${windDirection(Number(c.wind_direction_10m))} ${windSpeed.toFixed(0)} km/h（${windScale}級）`,
        cls: windScale >= 6 ? "danger" : windScale >= 5 ? "warn" : ""
      });
    }
    if(Number.isFinite(gustSpeed)){
      tiles.push({
        label: "陣風",
        value: `${gustSpeed.toFixed(0)} km/h（${gustScale}級）`,
        cls: gustScale >= 7 ? "danger" : gustScale >= 6 ? "warn" : ""
      });
    }
    if(Number.isFinite(Number(c.temperature_2m))){
      const feels = Number(c.apparent_temperature);
      tiles.push({
        label: "氣溫",
        value: `${Number(c.temperature_2m).toFixed(1)}°C${Number.isFinite(feels) ? `（體感 ${feels.toFixed(1)}°C）` : ""}`
      });
    }
    if(Number.isFinite(Number(c.relative_humidity_2m))){
      tiles.push({ label: "濕度", value: `${Number(c.relative_humidity_2m)}%` });
    }
    const rain = Number(c.precipitation);
    tiles.push({
      label: "天氣",
      value: `${weatherText(c.weather_code)}${Number.isFinite(rain) && rain > 0 ? `｜雨 ${rain.toFixed(1)} mm` : ""}`
    });
  }

  if(marine && marine.current){
    const m = marine.current;
    const sst = Number(m.sea_surface_temperature);
    const wave = Number(m.wave_height);
    const period = Number(m.wave_period);
    const current = Number(m.ocean_current_velocity);

    if(Number.isFinite(sst)){
      tiles.push({ label: "海水溫度", value: `${sst.toFixed(1)}°C` });
    }
    if(Number.isFinite(wave)){
      tiles.push({
        label: "浪高／週期",
        value: `${wave.toFixed(2)} m（${waveText(wave)}）${Number.isFinite(period) ? `｜${period.toFixed(1)} 秒` : ""}`,
        cls: wave >= 2.5 ? "danger" : wave >= 1.25 ? "warn" : ""
      });
    }
    if(Number.isFinite(current) && current > 0){
      tiles.push({ label: "海流", value: `${current.toFixed(1)} km/h` });
    }
  }

  if(!tiles.length){
    grid.innerHTML = `<div class="loading">暫無天氣及海況資料</div>`;
    return;
  }

  grid.className = "stat-grid";
  grid.innerHTML = tiles.map(tile =>
    `<div class="stat"><div class="stat-label">${tile.label}</div><div class="stat-value ${tile.cls || ""}">${tile.value}</div></div>`
  ).join("");
}

// ========== 天文台日月時間 ==========
async function loadSunMoon(){
  const el = document.getElementById("sunMoon");
  const d = getHKDateParts();
  const iso = `${d.year}-${d.month}-${d.day}`;
  try{
    const [srs, mrs] = await Promise.all([
      fetchJson(`${HKO_OPEN_API}?dataType=SRS&year=${d.year}&rformat=json`),
      fetchJson(`${HKO_OPEN_API}?dataType=MRS&year=${d.year}&rformat=json`)
    ]);
    const sun = (srs.data || []).find(row => row[0] === iso);
    const moon = (mrs.data || []).find(row => row[0] === iso);
    if(!sun && !moon) throw new Error("找不到今日日月資料");

    el.className = "astro-grid";
    el.innerHTML = `
      <div class="astro-item"><span>🌅 日出</span><b>${sun ? sun[1] : "—"}</b></div>
      <div class="astro-item"><span>🌇 日落</span><b>${sun ? sun[3] : "—"}</b></div>
      <div class="astro-item"><span>🌙 月出</span><b>${moon ? moon[1] : "—"}</b></div>
      <div class="astro-item"><span>🌘 月落</span><b>${moon ? moon[3] : "—"}</b></div>
    `;
  }catch(e){
    console.error("日月時間載入失敗:", e);
    el.className = "astro-grid";
    el.innerHTML = `<div class="loading">⚠️ 日月時間載入失敗</div>`;
  }
}

// ========== 天文台警告及閃電 ==========
async function loadRisk(){
  const el = document.getElementById("riskBox");
  const [warnResult, lightningResult] = await Promise.allSettled([
    fetchJson(`${HKO_WEATHER_API}?dataType=warnsum&lang=tc`),
    fetchJson(`${HKO_OPEN_API}?dataType=LHL&lang=tc&rformat=json`)
  ]);
  const lines = [];

  if(warnResult.status === "fulfilled"){
    const warnings = Object.values(warnResult.value || {})
      .map(w => w && w.name)
      .filter(Boolean);
    if(warnings.length){
      lines.push(`<div class="risk-line risk-danger">⚠️ 天文台警告：${warnings.join("、")}</div>`);
    }else{
      lines.push(`<div class="risk-line risk-ok">✅ 現時無天文台天氣警告</div>`);
    }
  }else{
    console.error("警告載入失敗:", warnResult.reason);
    lines.push(`<div class="risk-line">⚠️ 警告資料載入失敗</div>`);
  }

  if(lightningResult.status === "fulfilled"){
    const rows = Array.isArray(lightningResult.value.data) ? lightningResult.value.data : [];
    const cg = rows.find(r => r[1] === "雲對地" && r[2] === "香港境內");
    const cc = rows.find(r => r[1] === "雲間" && r[2] === "香港境內");
    const cgCount = cg ? Number(cg[3]) : 0;
    const ccCount = cc ? Number(cc[3]) : 0;
    const hasLightning = cgCount > 0 || ccCount > 0;
    lines.push(`<div class="risk-line ${hasLightning ? "risk-danger" : "risk-ok"}">⚡ 過去1小時閃電：雲對地 ${cgCount} 次｜雲間 ${ccCount} 次${hasLightning ? "（注意安全）" : ""}</div>`);
  }else{
    console.error("閃電資料載入失敗:", lightningResult.reason);
    lines.push(`<div class="risk-line">⚠️ 閃電資料載入失敗</div>`);
  }

  el.className = "";
  el.innerHTML = lines.join("");
}

// ========== 解析天文台潮汐 HLT 資料 ==========
function parseTideDay(raw, dateParts){
  if(!raw || !Array.isArray(raw.data)) throw new Error("潮汐資料格式有變");

  const all = [];
  raw.data.forEach(row => {
    for(let i = 2; i + 1 < row.length; i += 2){
      const time = row[i];
      const height = row[i + 1];
      if(time && height !== ""){
        all.push({ month: row[0], day: row[1], time, height: Number(height) });
      }
    }
  });

  all.forEach((event, i) => {
    if(i < all.length - 1){
      event.type = all[i + 1].height > event.height ? "low" : "high";
    }else if(i > 0){
      event.type = event.height > all[i - 1].height ? "high" : "low";
    }else{
      event.type = "unknown";
    }
  });

  return all.filter(event => event.month === dateParts.month && event.day === dateParts.day);
}

// ========== 渲染今日潮汐 ==========
function renderTides(events, dateParts){
  const title = document.getElementById("tideTitle");
  const list = document.getElementById("tideList");
  const dateLabel = `${Number(dateParts.month)}月${Number(dateParts.day)}日`;
  title.textContent = `🌊 今日潮汐（${dateLabel}）`;

  if(!events.length){
    list.className = "";
    list.innerHTML = `<div class="loading">今日暫無潮汐資料</div>`;
    return;
  }

  list.className = "";
  list.innerHTML = events.map(event => {
    const isHigh = event.type === "high";
    const cls = isHigh ? "tide-row tide-in" : event.type === "low" ? "tide-row tide-out" : "tide-row tide-unknown";
    const label = isHigh ? "🔼 漲潮（右口）" : event.type === "low" ? "🔽 退潮" : "🌊 潮汐";
    return `<div class="${cls}">${label}｜${event.time}｜潮高 ${event.height.toFixed(2)} m</div>`;
  }).join("");
}

async function loadTide(stationCode){
  const list = document.getElementById("tideList");
  list.className = "loading";
  list.textContent = "載入天文台潮汐...";
  const dateParts = getHKDateParts();
  try{
    const url = `${HKO_OPEN_API}?dataType=HLT&station=${stationCode}&year=${dateParts.year}&rformat=json`;
    const raw = await fetchJson(url);
    renderTides(parseTideDay(raw, dateParts), dateParts);
  }catch(e){
    console.error("潮汐載入失敗:", e);
    list.className = "loading";
    list.textContent = "⚠️ 潮汐載入失敗，請稍後再試";
  }
}

// ========== 渲染月相同提示 ==========
function renderMoonTip(){
  const today = new Date();
  const moon = getMoonPhase(today);
  document.getElementById("moonBox").innerHTML = `
  <div class="moon">${moon.emoji}</div>
  <div style="text-align:center;font-size:18px">${moon.name}</div>
  `;
  let tipText = "";
  if(moon.name.includes("滿月")){
    tipText = "🌕 滿月：夜晚月光足，<strong>日間淺灘魚口一般較差，優先考慮夜釣</strong>";
  }else if(moon.name.includes("新月")){
    tipText = "🌚 新月：夜晚幾乎冇月光，<strong>日間淺灘魚口會好啲，日釣首選</strong>";
  }else{
    tipText = "ℹ️ 月相普通，魚口睇潮汐同氣壓；綠色漲潮段最值得落竿";
  }
  document.getElementById("fishTip").innerHTML = `<div class="fish-note">${tipText}</div>`;
}

// ========== 主入口 ==========
async function main(){
  const spot = document.getElementById("spot").value;
  renderMoonTip();
  await Promise.all([
    loadTide(spot),
    loadEnvironment(spot),
    loadSunMoon(),
    loadRisk()
  ]);
}

document.getElementById("spot").onchange = main;
main();
</script>
</body>
</html>
